name = "flyology_simd_benchmarks"
description = "Statistical backend benchmarks for flyology_simd"
version = "0.1.1-dev"
licenses = "MIT OR Apache-2.0"
authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
project-files = ["benchmarks.gpr"]
executables = ["simd_benchmark", "class_scan_benchmark", "dot_product_benchmark"]
tags = ["simd", "benchmark", "neon", "performance"]

[gpr-set-externals.'case(host-arch)']
aarch64 = { FLYOLOGY_SIMD_ARCH = "aarch64" }
x86-64 = { FLYOLOGY_SIMD_ARCH = "x86_64" }

[[depends-on]]
flyology_simd = "*"
flyology_bench = "*"

[[pins]]
flyology_simd = { path = ".." }
flyology_bench = { url = "https://github.com/flyology-ada/flyology.git", subdir = "flyology_bench", commit = "a6a6f0b2f25c5660c267fca817d25143534492f5" }

[build-switches]
"*".ada_version = "Ada2022"
release.optimization = "Performance"
release.compile_checks = "Warnings"
