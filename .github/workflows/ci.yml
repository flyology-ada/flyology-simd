name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: scalar
            avx2: disabled
            wide_backend: composed
            release: false
          - architecture: x86_64
            avx2: disabled
            wide_backend: composed
            release: true
          - architecture: x86_64
            avx2: enabled
            wide_backend: avx2
            release: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: alire-project/setup-alire@v6.0.0
      - name: Select verified toolchain
        run: alr toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Verify generated sources
        if: ${{ matrix.architecture == 'scalar' }}
        run: |
          python3 scripts/generate_full_family.py
          python3 scripts/generate_backends.py
          python3 scripts/generate_conversion_tests.py
          python3 scripts/generate_wide_family.py
          python3 scripts/generate_wide_tests.py
          python3 scripts/check_simd_coverage.py \
            --generate-probes --check-static --write-report --require-complete
          git diff --exit-code
      - name: Reject Wide AVX2 without AVX2 objects
        if: ${{ matrix.architecture == 'x86_64' && matrix.avx2 == 'disabled' }}
        run: |
          if alr build -- \
            -XFLYOLOGY_SIMD_ARCH=x86_64 \
            -XFLYOLOGY_SIMD_AVX2=disabled \
            -XFLYOLOGY_SIMD_WIDE_BACKEND=avx2 \
            > /tmp/flyology-simd-invalid-wide.log 2>&1
          then
            echo "invalid Wide AVX2 configuration built successfully" >&2
            exit 1
          fi
          grep -F \
            "FLYOLOGY_SIMD_WIDE_BACKEND=avx2 requires x86_64 and FLYOLOGY_SIMD_AVX2=enabled" \
            /tmp/flyology-simd-invalid-wide.log
      - name: Build debug library
        if: ${{ !matrix.release }}
        run: >-
          alr build --
          -XFLYOLOGY_SIMD_ARCH=${{ matrix.architecture }}
          -XFLYOLOGY_SIMD_AVX2=${{ matrix.avx2 }}
          -XFLYOLOGY_SIMD_WIDE_BACKEND=${{ matrix.wide_backend }}
      - name: Build release library
        if: ${{ matrix.release }}
        run: >-
          alr build --release --
          -XFLYOLOGY_SIMD_ARCH=${{ matrix.architecture }}
          -XFLYOLOGY_SIMD_AVX2=${{ matrix.avx2 }}
          -XFLYOLOGY_SIMD_WIDE_BACKEND=${{ matrix.wide_backend }}
      - name: Build tests
        run: >-
          alr exec -- gprbuild -p -P tests/tests.gpr
          -XFLYOLOGY_SIMD_ARCH=${{ matrix.architecture }}
          -XFLYOLOGY_SIMD_AVX2=${{ matrix.avx2 }}
          -XFLYOLOGY_SIMD_WIDE_BACKEND=${{ matrix.wide_backend }}
      - name: Build examples
        run: >-
          alr exec -- gprbuild -p -P examples/examples.gpr
          -XFLYOLOGY_SIMD_ARCH=${{ matrix.architecture }}
          -XFLYOLOGY_SIMD_AVX2=${{ matrix.avx2 }}
          -XFLYOLOGY_SIMD_WIDE_BACKEND=${{ matrix.wide_backend }}
      - name: Run differential tests
        run: |
          ./bin/simd_tests
          ./bin/family_tests
          ./bin/wide_tests
          ./bin/conversion_tests
          ./bin/guard_page_tests
      - name: Require executable AVX2 coverage
        if: ${{ matrix.avx2 == 'enabled' }}
        run: ./bin/simd_tests --require-avx2
      - name: Check generated code
        if: ${{ matrix.architecture == 'x86_64' }}
        run: >-
          ./scripts/check_codegen.sh x86_64 ${{ matrix.avx2 }}
          ${{ matrix.wide_backend }}

  linux-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: alire-project/setup-alire@v6.0.0
      - name: Select verified toolchain
        run: alr toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Run scalar AddressSanitizer suite
        run: ./scripts/run_sanitized_tests.sh scalar
      - name: Run SSE2 AddressSanitizer suite
        run: ./scripts/run_sanitized_tests.sh x86_64

  macos-aarch64:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        release: [false, true]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: alire-project/setup-alire@v6.0.0
      - name: Select verified toolchain
        run: alr toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Build debug library
        if: ${{ !matrix.release }}
        run: alr build -- -XFLYOLOGY_SIMD_ARCH=aarch64
      - name: Build release library
        if: ${{ matrix.release }}
        run: alr build --release -- -XFLYOLOGY_SIMD_ARCH=aarch64
      - name: Build tests
        run: >-
          alr exec -- gprbuild -p -P tests/tests.gpr
          -XFLYOLOGY_SIMD_ARCH=aarch64
      - name: Build examples
        run: >-
          alr exec -- gprbuild -p -P examples/examples.gpr
          -XFLYOLOGY_SIMD_ARCH=aarch64
      - name: Run differential tests
        run: |
          ./bin/simd_tests
          ./bin/family_tests
          ./bin/wide_tests
          ./bin/conversion_tests
          ./bin/guard_page_tests
      - name: Check generated code
        run: ./scripts/check_codegen.sh aarch64 disabled
