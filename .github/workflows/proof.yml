name: SPARK proof

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    flyology-simd-proof-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: alire-project/setup-alire@v6.0.0
      - name: Run full SPARK campaign
        run: ./scripts/prove.sh
