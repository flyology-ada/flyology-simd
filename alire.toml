name = "flyology_simd"
description = "Portable, strongly typed SIMD foundations for Ada"
version = "0.1.0-dev"
licenses = "MIT OR Apache-2.0"
authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
project-files = ["flyology_simd.gpr"]
tags = ["simd", "vector", "portable", "neon", "sse2", "avx2"]

[build-switches]
"*".ada_version = "Ada2022"
development.optimization = "Debug"
development.compile_checks = "Errors"
release.optimization = "Performance"
release.compile_checks = "Warnings"
